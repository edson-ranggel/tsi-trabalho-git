<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu com Troca de Conteúdo</title>
    <link rel="stylesheet" href="styles3.css"> </head>
<body>

    <div class="container">
        <div class="menu">
            <h2>Menu de Opções</h2>
            <button class="menu-item" data-content-id="opcao1">Opção 1</button>
            <button class="menu-item" data-content-id="opcao2">Opção 2</button>
            <button class="menu-item" data-content-id="opcao3">Opção 3</button>
        </div>

        <div class="content-area">
            <h1>Conteúdo Principal</h1>
            
            <div id="content-display">
                <p>Clique em uma das opções do menu à esquerda para exibir o conteúdo correspondente aqui.</p>
                <p>Este é o conteúdo inicial.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script> </body>
</html>
